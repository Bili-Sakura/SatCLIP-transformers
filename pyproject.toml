[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "satclip"
version = "0.1.0"
description = "SatCLIP: Global, General-Purpose Location Embeddings with Satellite Imagery"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
    { name = "Microsoft Research" },
]
keywords = ["satellite", "geospatial", "clip", "transformers", "embeddings"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy",
    "einops",
    "transformers>=4.40.0",
    "torch",
]

[project.optional-dependencies]
vision = [
    "timm",
    "torchgeo",
]
dev = [
    "safetensors",
    "huggingface_hub",
]

[project.urls]
Homepage = "https://github.com/microsoft/satclip"
Repository = "https://github.com/microsoft/satclip"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
satclip = ["positional_encoding/*.py"]
